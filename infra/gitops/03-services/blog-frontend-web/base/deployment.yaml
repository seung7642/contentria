apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-frontend-web
  labels:
    app: blog-frontend-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-frontend-web
  template:
    metadata:
      labels:
        app: blog-frontend-web
    spec:
      containers:
        - name: blog-frontend-web
          image: contentria/blog-frontend # 태그는 환경별 overlay에서 지정한다.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: blog-frontend-web
          # Next.js 런타임 메모리를 고려한 값
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
