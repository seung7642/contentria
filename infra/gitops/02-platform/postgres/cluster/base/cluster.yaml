apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  storage:
    size: 20Gi

  postgresql:
    # pg_stat_statements, auto_explain 파라미터를 지정하면 operator가 shared_preload_libraries에 자동으로 추가한다.
    parameters:
      pg_stat_statements.track: top
      auto_explain.log_min_duration: "1000" # ms 이상 걸린 쿼리의 실행계획을 로그로 남긴다.
      auto_explain.log_analyze: "on"

  # 블로그 서비스용 DB와 계정은 클러스터 생성 시 함께 만든다.
  bootstrap:
    initdb:
      database: contentria
      owner: contentria
      secret:
        name: postgres-contentria # infra/secrets로 수동 적용
      postInitApplicationSQL:
        - CREATE SCHEMA contentria AUTHORIZATION contentria
        - ALTER ROLE contentria SET search_path TO contentria, public
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements

  # keycloak, openfga 계정. DB는 databases.yaml에서 만든다.
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: postgres-keycloak # infra/secrets로 수동 적용
      - name: openfga
        ensure: present
        login: true
        passwordSecret:
          name: postgres-openfga # infra/secrets로 수동 적용
