# keycloak, openfga용 DB. 블로그 서비스용 DB는 cluster.yaml의 initdb에서 만든다.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openfga
spec:
  name: openfga
  owner: openfga
  cluster:
    name: postgres
