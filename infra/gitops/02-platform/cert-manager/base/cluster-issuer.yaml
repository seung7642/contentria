apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    # cert-manager 차트(CRD, webhook)가 먼저 설치된 뒤 적용한다.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    # 인증서 만료 안내를 받을 주소. 실제 주소로 바꾼다.
    email: "your-email@contentria.com"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: envoy-gateway-system
                kind: Gateway
                sectionName: http
