# 권한 관리 서버. Postgres가 먼저 준비되어 있어야 한다 (wave 2)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openfga
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://openfga.github.io/helm-charts
      chart: openfga
      targetRevision: 0.3.15
      helm:
        releaseName: openfga
        valueFiles:
          - $values/infra/gitops/02-platform/openfga/values.yaml
          - $values/infra/gitops/02-platform/openfga/values-dev.yaml
    - repoURL: https://github.com/seung7642/contentria.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openfga
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
