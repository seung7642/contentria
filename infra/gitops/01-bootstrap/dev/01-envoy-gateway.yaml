# Gateway API CRD와 Envoy Gateway 컨트롤러, 외부 진입점(Gateway)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.2
      helm:
        releaseName: eg
        valueFiles:
          - $values/infra/gitops/02-platform/envoy-gateway/values.yaml
          - $values/infra/gitops/02-platform/envoy-gateway/values-dev.yaml
    - repoURL: https://github.com/seung7642/contentria.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/seung7642/contentria.git
      targetRevision: main
      path: infra/gitops/02-platform/envoy-gateway/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
