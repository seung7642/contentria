# 인증서 발급. Gateway를 감시하려면 Gateway API CRD가 먼저 설치되어 있어야 한다 (wave 1의 envoy-gateway)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/infra/gitops/02-platform/cert-manager/values.yaml
          - $values/infra/gitops/02-platform/cert-manager/values-dev.yaml
    - repoURL: https://github.com/seung7642/contentria.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/seung7642/contentria.git
      targetRevision: main
      path: infra/gitops/02-platform/cert-manager/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
