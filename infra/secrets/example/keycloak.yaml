# infra/secrets/<env>/keycloak.yaml로 복사한 뒤 값을 채운다.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
# 최초 관리자 계정
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: keycloak
type: Opaque
stringData:
  username: ""
  password: ""
---
# DB 비밀번호. database.yaml의 postgres-keycloak과 같은 값
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: keycloak
type: Opaque
stringData:
  password: ""
