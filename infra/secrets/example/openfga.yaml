# infra/secrets/<env>/openfga.yaml로 복사한 뒤 값을 채운다.
apiVersion: v1
kind: Namespace
metadata:
  name: openfga
---
# DB 접속 URI. 비밀번호는 database.yaml의 postgres-openfga와 같은 값
apiVersion: v1
kind: Secret
metadata:
  name: openfga-datastore
  namespace: openfga
type: Opaque
stringData:
  uri: "postgres://openfga:<password>@postgres-rw.database.svc.cluster.local:5432/openfga?sslmode=require"
