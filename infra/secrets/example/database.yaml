# infra/secrets/<env>/database.yaml로 복사한 뒤 값을 채운다.
# CloudNativePG가 DB 계정을 만들 때 쓰는 비밀번호. username은 바꾸지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-contentria
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: contentria
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-keycloak
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-openfga
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: openfga
  password: ""
