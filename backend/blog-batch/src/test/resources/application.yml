spring:
  # MailSenderAutoConfiguration only activates when spring.mail.host is set — needed so the
  # JavaMailSender bean exists for EmailService (see the shadowing note further down).
  mail:
    host: localhost
    port: 587
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true


  batch:
    jdbc:
      initialize-schema: always
    job:
      # Tests trigger jobs manually via JobOperator. With multiple Job beans on the classpath,
      # JobLauncherApplicationRunner would otherwise fail context startup demanding
      # spring.batch.job.name.
      enabled: false

logging:
  level:
    org.springframework.batch: DEBUG

# This file shadows src/main/resources/application.yml on the test classpath entirely
# (Gradle puts test/resources first, and Boot resolves a single classpath:/application.yml),
# so every @ConfigurationProperties bean the app context needs — even ones unrelated to
# what a given test actually exercises — must have its required values duplicated here too.
common:
  mail:
    mailgun:
      from-address: "Contentria <no-reply@test.contentria.com>"
  r2:
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    endpoint: http://localhost:9000
    bucket-name: test-bucket