spring:
  application:
    name: blog-batch
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: never # The production database is managed using migration tools like Flyway.
    job:
      enabled: false # Prevent all jobs from starting automatically on startup.
  mail:
    host: ${MAILGUN_HOST:smtp.mailgun.org}
    port: ${MAILGUN_PORT:587}
    username: ${MAILGUN_USERNAME}
    password: ${MAILGUN_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000 # Connection timeout
          timeout: 5000 # Read timeout
          writetimeout: 5000 # Write timeout

common:
  mail:
    mailgun:
      from-address: "Contentria <no-reply@${MAILGUN_DOMAIN}>"
  # R2 access for the video GC job (loaded for all batch jobs — the context is shared,
  # so blog-batch-secret must provide these for every batch CronJob).
  r2:
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
